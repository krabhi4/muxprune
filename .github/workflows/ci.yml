name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # caches both the module download dir and the Go build cache,
          # keyed on go.sum; subsequent runs skip recompiling dependencies
          cache: true
      - name: Install media tools for integration tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix
      - run: go vet ./...
      - run: go test ./...
      - name: Verify CGO-free static build
        run: CGO_ENABLED=0 go build ./cmd/muxprune
